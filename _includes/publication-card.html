{% assign publication = include.post %}
<article class="publication-item">
  <p class="publication-item__title">{{ publication.title }}</p>
  {% if publication.authors %}<p class="publication-item__authors">{{ publication.authors }}</p>{% endif %}
  <p class="publication-item__venue">{{ publication.venue_short | default: publication.venue }}, {{ publication.date | date: "%Y" }}</p>
</article>
